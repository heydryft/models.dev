# Released October 2024: https://www.recraft.ai/docs/recraft-models/recraft-V3
# Formats: raster results are WebP by default or PNG (image_format), vector models return SVG: https://www.recraft.ai/docs/api-reference/endpoints
# Input: a text prompt (the generation endpoint).
schema = 2
v2_only = true
type = "image"
name = "Recraft V3"
description = "Text-to-image model with long-text rendering, style control and precise layout"
open_weights = false
release_date = "2024-10"

[modalities]
input = ["text"]
output = ["image/webp", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
