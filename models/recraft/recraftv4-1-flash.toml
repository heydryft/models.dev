# Announced 2026-09-23 ("the fastest model we have shipped"): https://www.recraft.ai/blog/meet-recraft-v4-1-flash
# Formats: raster results are WebP by default or PNG (image_format), vector models return SVG: https://www.recraft.ai/docs/api-reference/endpoints
# Input: a text prompt (the generation endpoint).
schema = 2
v2_only = true
type = "image"
name = "Recraft V4.1 Flash"
description = "Fastest Recraft V4.1 tier for 1K raster text-to-image generation"
open_weights = false
release_date = "2026-09-23"

[modalities]
input = ["text"]
output = ["image/webp", "image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
